<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Player Library</title>
    <meta name="description" content="A library where every NBA player has a book: active players on their current team's shelf, retired players on one long shelf." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Oswald:wght@500&family=Playfair+Display:wght@700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" />
    <style>
      /* The loading page: drawn before any script runs, removed by the app once the shelves are ready.
         Everything is prefixed bt- so nothing in the app's own stylesheet can reach it. */
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 12px; background: #fff; color: #111; font-family: Barlow, 'Helvetica Neue', Arial, sans-serif; transition: opacity .5s ease, transform .6s ease; }
      #boot.done { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #boot .bt-stage { width: 280px; height: 210px; display: grid; place-items: center; perspective: 1100px; }
      #boot .bt-book { position: relative; width: 120px; height: 160px; transform-style: preserve-3d; transform: rotateX(16deg) translateX(-60px); animation: bt-in 1.1s .2s cubic-bezier(.45,.05,.25,1) forwards; }
      #boot .bt-book::after { content: ''; position: absolute; left: -130px; right: -10px; bottom: -28px; height: 20px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.2), transparent); transform: translateZ(-2px); }
      #boot .bt-sheet { position: absolute; inset: 0; transform-origin: 0 50%; transform-style: preserve-3d; }
      #boot .bt-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0 4px 4px 0; }
      #boot .bt-face.back { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
      #boot .bt-paper { background: #faf6ec repeating-linear-gradient(to bottom, transparent 0 11px, rgba(60,40,20,.10) 11px 12px); }
      #boot .bt-pages { position: absolute; inset: 0; border-radius: 0 4px 4px 0; background: #f5efe2 repeating-linear-gradient(to bottom, transparent 0 11px, rgba(60,40,20,.10) 11px 12px); box-shadow: 3px 3px 0 #e6dcc6, 6px 6px 0 #d8ccb1; }
      #boot .bt-paper.back { box-shadow: inset -8px 0 10px -6px rgba(0,0,0,.2); }
      #boot .bt-front { display: grid; place-items: center; background: radial-gradient(120% 80% at 60% 30%, #2f5bb0, #1d428a 55%, #142f63); box-shadow: inset 7px 0 8px -4px rgba(0,0,0,.45); }
      #boot .bt-front::before { content: ''; position: absolute; left: 0; right: 0; bottom: 30px; height: 5px; background: #d8b25a; }
      #boot .bt-front b { font: 800 40px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; color: #fff; letter-spacing: .02em; }
      #boot .bt-inside { background: #1d428a repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 10px); box-shadow: -3px 3px 0 #163570, -6px 6px 0 #122c5d; }
      #boot .bt-cover { animation: bt-open 1.1s .3s cubic-bezier(.45,.05,.25,1) forwards; }
      #boot .bt-leaf { animation: bt-leaf 2.6s cubic-bezier(.45,.05,.25,1) infinite; }
      #boot .bt-l1 { animation-delay: 1.3s; } #boot .bt-l2 { animation-delay: 1.6s; } #boot .bt-l3 { animation-delay: 1.9s; }
      #boot .bt-name { margin: 6px 0 0; font: 600 26px/1.1 Newsreader, Georgia, serif; letter-spacing: .005em; opacity: 0; animation: bt-rise .6s .5s ease forwards; }
      #boot .bt-msg { margin: 0; font-size: 14px; color: #6b6b6b; min-height: 20px; opacity: 0; animation: bt-rise .6s .7s ease forwards; }
      #boot .bt-bar { width: 160px; height: 3px; border-radius: 3px; background: #ececec; overflow: hidden; opacity: 0; animation: bt-rise .6s .8s ease forwards; }
      #boot .bt-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #111; animation: bt-slide 1.2s ease-in-out infinite; }
      @keyframes bt-in { to { transform: rotateX(16deg) translateX(0); } }
      @keyframes bt-open { from { transform: rotateY(0); } to { transform: rotateY(-176deg); } }
      @keyframes bt-leaf { 0% { transform: rotateY(0); opacity: 1; } 40% { transform: rotateY(-174deg); } 86% { transform: rotateY(-174deg); opacity: 1; } 94%, 100% { transform: rotateY(-174deg); opacity: 0; } }
      @keyframes bt-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes bt-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot .bt-book { animation: none !important; } #boot .bt-book { transform: rotateX(16deg); } #boot .bt-cover { transform: rotateY(-176deg); }
        #boot .bt-name, #boot .bt-msg, #boot .bt-bar { opacity: 1; } #boot .bt-leaf { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="bt-stage" aria-hidden="true">
        <div class="bt-book">
          <div class="bt-pages"></div>
          <div class="bt-sheet bt-leaf bt-l1"><div class="bt-face bt-paper"></div><div class="bt-face bt-paper back"></div></div>
          <div class="bt-sheet bt-leaf bt-l2"><div class="bt-face bt-paper"></div><div class="bt-face bt-paper back"></div></div>
          <div class="bt-sheet bt-leaf bt-l3"><div class="bt-face bt-paper"></div><div class="bt-face bt-paper back"></div></div>
          <div class="bt-sheet bt-cover"><div class="bt-face bt-front"><b>PL</b></div><div class="bt-face bt-inside back"></div></div>
        </div>
      </div>
      <p class="bt-name">Player Library</p>
      <p class="bt-msg" id="boot-msg">Opening the library…</p>
      <div class="bt-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:system-ui,sans-serif;color:#111;background:#fff">The Player Library needs JavaScript to open its books.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
