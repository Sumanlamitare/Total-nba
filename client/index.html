<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Player Library</title>
    <meta name="description" content="A library where every NBA player has a book: active players on their current team's shelf, retired players on one long shelf." />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Oswald:wght@500&family=Playfair+Display:wght@700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" />
    <style>
      /* The loading page — tip-off in an empty arena. Drawn before any script runs; the app fills in the scoreboard and
         the ticker from the real catalogue, then closes the scene into the ball. Everything is prefixed bt-. */
      #boot { --p: .18; position: fixed; inset: 0; z-index: 100; overflow: hidden; color: #fff; background: #08080a; font-family: Barlow, 'Helvetica Neue', Arial, sans-serif;
        clip-path: circle(150% at 50% 62%); transition: clip-path .85s cubic-bezier(.7,0,.2,1), --p 1.2s ease; }
      #boot.done { clip-path: circle(0% at 50% 62%); pointer-events: none; }
      #boot.ready { --p: 1; }
      /* the arena: a warm glow over the floor, a spotlight that sweeps the court */
      #boot .bt-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 45% at 50% 62%, rgba(255,140,40,.20), transparent 70%), radial-gradient(ellipse 120% 70% at 50% 0%, #1c1a22, transparent 70%); }
      #boot .bt-beam { position: absolute; left: 50%; top: -20%; width: 70vmax; height: 120vmax; translate: -50% 0; transform-origin: 50% 0;
        background: conic-gradient(from 168deg at 50% 0%, transparent 0deg, rgba(255,236,200,.14) 12deg, rgba(255,236,200,.04) 24deg, transparent 26deg); animation: bt-sweep 6s ease-in-out infinite alternate; mix-blend-mode: screen; }
      #boot .bt-floor { position: absolute; left: 50%; top: 74%; width: 240vmax; height: 70vh; translate: -50% 0; transform: perspective(600px) rotateX(58deg); transform-origin: 50% 0;
        background: repeating-linear-gradient(90deg, #5a3a1c 0 34px, #6b4522 34px 36px, #613f1f 36px 70px, #74502a 70px 72px);
        -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 44%, #000 56%, transparent 70%); mask-image: linear-gradient(90deg, transparent 30%, #000 44%, #000 56%, transparent 70%); }
      #boot .bt-haze { position: absolute; left: 0; right: 0; top: calc(74% - 1px); height: 16vh; background: linear-gradient(to bottom, rgba(8,8,10,.85), transparent); }
      #boot .bt-court { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #boot .bt-court * { fill: none; stroke: rgba(255,240,220,.7); stroke-width: 2.5; stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: bt-draw 1.8s .2s cubic-bezier(.6,0,.2,1) forwards; }
      #boot .bt-court .c1 { stroke: rgba(255,240,220,.35); }
      #boot .bt-court .c2 { rx: min(260px, 36vw); } #boot .bt-court .c3 { rx: min(72px, 10vw); }
      #boot .bt-court .c2 { animation-delay: .5s; } #boot .bt-court .c3 { animation-delay: .8s; }
      /* the giant title, filling with colour as the library loads */
      #boot .bt-title { position: absolute; left: 0; right: 0; top: 11vh; margin: 0; text-align: center; font: 800 clamp(64px, 17vw, 250px)/.82 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif; letter-spacing: -.01em; text-transform: uppercase;
        color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.28);
        background: linear-gradient(to top, #ff8a2b 0, #ffd28a calc(var(--p) * 100%), transparent calc(var(--p) * 100%)) no-repeat; -webkit-background-clip: text; background-clip: text;
        animation: bt-title 1s .1s cubic-bezier(.2,.7,.2,1) both; }
      #boot .bt-title span { display: block; }
      #boot.ready .bt-title { background-size: 100% 100%; }
      @property --p { syntax: '<number>'; inherits: true; initial-value: .18; }
      /* the ball: bounces at centre court, spinning, squashing on the floor, with its shadow */
      #boot .bt-ball-wrap { position: absolute; left: 50%; top: 74%; width: 0; height: 0; }
      #boot .bt-ball { position: absolute; left: -60px; top: -330px; width: 120px; height: 120px; animation: bt-bounce 1.05s cubic-bezier(.5,0,.5,1) infinite; transform-origin: 50% 100%; }
      #boot .bt-ball svg { width: 100%; height: 100%; animation: bt-spin 2.1s linear infinite; filter: drop-shadow(0 0 22px rgba(255,120,30,.35)); }
      #boot .bt-shadow { position: absolute; left: -70px; top: -12px; width: 140px; height: 24px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent); animation: bt-shadow 1.05s cubic-bezier(.5,0,.5,1) infinite; }
      /* scoreboard and ticker */
      #boot .bt-board { position: absolute; left: 50%; bottom: 58px; translate: -50% 0; display: flex; gap: 14px; align-items: center; padding: 10px 18px; border-radius: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,180,90,.25); box-shadow: 0 0 40px rgba(255,140,40,.12) inset; animation: bt-up .6s .7s ease both; }
      #boot .bt-n { font: 700 34px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; font-variant-numeric: tabular-nums; color: #ffb347; text-shadow: 0 0 12px rgba(255,160,60,.7); letter-spacing: .04em; min-width: 3.4ch; text-align: right; }
      #boot .bt-l { font: 600 11px/1.3 Barlow, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.7); }
      #boot .bt-l b { display: block; color: #fff; font-size: 13px; letter-spacing: .12em; }
      #boot .bt-ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; overflow: hidden; background: #000; border-top: 1px solid rgba(255,180,90,.25); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); animation: bt-up .6s .9s ease both; }
      #boot .bt-run { display: inline-flex; gap: 28px; padding-left: 100%; white-space: nowrap; font: 700 15px/40px 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ffb347; text-shadow: 0 0 8px rgba(255,160,60,.6); animation: bt-tick 26s linear infinite; }
      #boot .bt-run i { color: rgba(255,255,255,.35); font-style: normal; }
      @keyframes bt-sweep { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
      @keyframes bt-draw { to { stroke-dashoffset: 0; } }
      @keyframes bt-title { from { opacity: 0; transform: translateY(30px) scale(.96); letter-spacing: .08em; } }
      @keyframes bt-bounce { 0%, 100% { transform: translateY(0) scale(1); } 46% { transform: translateY(204px) scale(1.04, .96); } 50% { transform: translateY(210px) scale(1.14, .84); } 54% { transform: translateY(204px) scale(.97, 1.04); } }
      @keyframes bt-shadow { 0%, 100% { transform: scale(.45); opacity: .35; } 50% { transform: scale(1.05); opacity: .95; } }
      @keyframes bt-spin { to { transform: rotate(360deg); } }
      @keyframes bt-up { from { opacity: 0; transform: translateY(14px); } }
      @keyframes bt-tick { to { transform: translateX(-100%); } }
      @media (max-width: 600px) { #boot .bt-title { top: 15vh; font-size: 25vw; } #boot .bt-ball { left: -42px; top: -290px; width: 84px; height: 84px; } #boot .bt-shadow { left: -50px; width: 100px; } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot { animation: none !important; transition: none !important; } #boot .bt-court * { stroke-dashoffset: 0; } #boot .bt-ball { transform: translateY(210px); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Opening the Player Library">
      <div class="bt-glow"></div>
      <div class="bt-beam"></div>
      <div class="bt-floor"></div>
      <div class="bt-haze"></div>
      <svg class="bt-court" aria-hidden="true">
        <line class="c1" x1="0" y1="74%" x2="100%" y2="74%" /><ellipse class="c2" cx="50%" cy="74%" rx="240" ry="34" /><ellipse class="c3" cx="50%" cy="74%" rx="70" ry="10" />
      </svg>
      <h1 class="bt-title" aria-hidden="true"><span>Player</span><span>Library</span></h1>
      <div class="bt-ball-wrap" aria-hidden="true">
        <div class="bt-shadow"></div>
        <div class="bt-ball"><svg viewBox="0 0 100 100"><defs><radialGradient id="btg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb066"/><stop offset=".55" stop-color="#e8701f"/><stop offset="1" stop-color="#9c3f0c"/></radialGradient></defs>
          <circle cx="50" cy="50" r="48" fill="url(#btg)"/><g fill="none" stroke="#2a1306" stroke-width="2.6" stroke-linecap="round"><path d="M50 2v96M2 50h96"/><path d="M15 16c14 12 14 56 0 68"/><path d="M85 16c-14 12-14 56 0 68"/></g></svg></div>
      </div>
      <div class="bt-board"><span class="bt-n" id="boot-n">—</span><span class="bt-l"><b>Players</b><span id="boot-msg">Tipping off…</span></span></div>
      <div class="bt-ticker" aria-hidden="true"><div class="bt-run" id="boot-run"><span>Every player</span><i>●</i><span>Every season</span><i>●</i><span>Every book</span><i>●</i><span>Active and retired</span><i>●</i><span>All 30 teams</span></div></div>
    </div>
    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:system-ui,sans-serif;color:#111;background:#fff">The Player Library needs JavaScript to open its books.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
