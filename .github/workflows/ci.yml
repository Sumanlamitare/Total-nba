name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start MongoDB
        run: docker run -d --name mongo -p 27017:27017 mongo:7 --quiet
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://localhost:27017
      - run: npm run build
      - name: Browser test
        # The runner's own Google Chrome: no browser download or apt packages (that install has hung on slow mirrors).
        timeout-minutes: 8
        run: |
          npm i --no-save playwright@1.48.2
          CHROMIUM_PATH="$(command -v google-chrome || command -v google-chrome-stable)" npm run test:ui
