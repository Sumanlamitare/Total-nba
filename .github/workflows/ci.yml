name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start MongoDB
        run: docker run -d --name mongo -p 27017:27017 mongo:7 --quiet
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
        env:
          MONGODB_URI: mongodb://localhost:27017
      - run: npm run build
      - name: Browser test
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node --test test/ui.test.mjs
        env:
          MONGODB_URI: mongodb://localhost:27017
      - name: Mobile app — install
        working-directory: mobile
        run: npm ci
      - name: Mobile app — iOS bundle compiles
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios
        env:
          CI: 1
      - name: Mobile app — web build for testing
        working-directory: mobile
        run: npx expo export --platform web --output-dir dist-web
        env:
          CI: 1
          EXPO_PUBLIC_API_URL: http://localhost:5693
      - name: Mobile app — two people use it against the real API
        run: node --test test/mobile.test.mjs
        env:
          MONGODB_URI: mongodb://localhost:27017
