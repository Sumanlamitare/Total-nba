name: Update stats and deploy

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      from:
        description: 'Backfill from date (YYYY-MM-DD)'
        required: false
        default: '2023-10-24'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Big Balls Data API
        continue-on-error: true
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: node scripts/probe-bbs.mjs
      - name: Fetch box scores from ESPN
        run: node scripts/update.mjs --from "${{ github.event.inputs.from || '2023-10-24' }}"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update stats data" && git push)
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
