name: Audit data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node tools/audit.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Push results to site-check branch
        if: always()
        run: |
          cd audit
          git init -q && git checkout -q -b audit
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "audit"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit:audit
