name: Pull NBA data into MongoDB

# Loads NBA box scores from ESPN's free public API (no key) into MongoDB.
# The first run loads history from HISTORY_FROM; later runs only refresh recent days.
on:
  schedule:
    - cron: '7 */2 * * *'   # every 2 hours
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Pull into MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          HISTORY_FROM: '2001'
        run: |
          if [ -z "$MONGODB_URI" ]; then echo "::warning::Add the MONGODB_URI secret to start pulling"; exit 0; fi
          npm run ingest
