name: Score the nights

# Every morning: score last night's games (and any night of the current season not yet final). On demand: backfill
# whole seasons, e.g. seasons "2022,2023,2024,2025,2026" (seasons are named by the year they end).
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: seasons to backfill, comma-separated (empty = the current season)
        default: ''
      force:
        description: rescore nights already stored (yes/no)
        default: 'no'
  schedule:
    - cron: '17 11 * * *'   # 7:17 a.m. Eastern, after the West Coast games

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seasons: ${{ steps.p.outputs.seasons }}
    steps:
      - id: p
        env:
          SEASONS: ${{ inputs.seasons }}
        run: |
          if [ -z "$SEASONS" ]; then echo 'seasons=["current"]' >> "$GITHUB_OUTPUT"; else echo "seasons=$(jq -cn --arg s "$SEASONS" '$s | split(",") | map(gsub(" "; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"; fi
  ingest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        season: ${{ fromJson(needs.plan.outputs.seasons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Score
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SEASON: ${{ matrix.season }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          [ "$SEASON" != "current" ] && args="--season $SEASON"
          [ "$FORCE" = "yes" ] && args="$args --force"
          node scripts/ingest.mjs $args
