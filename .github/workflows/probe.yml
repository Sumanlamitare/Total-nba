name: Probe data sources

on:
  workflow_dispatch:
  push:
    branches: [run-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe-atn.mjs
      - name: Database size
        if: always()
        run: |
          npm ci --no-audit --no-fund >/dev/null
          node -e "
          const { MongoClient } = await import('mongodb');
          const c = new MongoClient(process.env.MONGODB_URI); await c.connect();
          const dbs = await c.db().admin().listDatabases();
          for (const d of dbs.databases) { const s = await c.db(d.name).stats().catch(() => ({})); console.log(d.name, d.sizeOnDisk, 'data', s.dataSize, 'storage', s.storageSize, 'idx', s.indexSize); }
          await c.close();" --input-type=module 2>&1 | tee probe/db.txt
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Push results to the probe branch
        if: always()
        run: |
          cd probe
          git init -q && git checkout -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
