name: Probe Big Balls API

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'docs or api'
        default: 'docs'
      paths:
        description: 'API paths (space separated) when mode=api'
        default: '/v1/leagues'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          PATHS: ${{ inputs.paths }}
        run: node tools/probe-bbs.js "${{ inputs.mode }}"
      - name: Push output to bbs-probe branch
        run: |
          cd probe-out
          git init -q && git checkout -q -b bbs-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe output ${{ inputs.mode }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bbs-probe:bbs-probe-${{ inputs.mode }}
