name: Check live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site URL'
        default: 'https://total-nba-ja9d.vercel.app'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/site-check.cjs "${{ inputs.url }}"
      - name: Push results to site-check branch
        if: always()
        run: |
          cd site-check
          git init -q && git checkout -q -b site-check
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "site check"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-check:site-check
