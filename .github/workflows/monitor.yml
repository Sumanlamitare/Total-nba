name: Live monitor

# Watches every game through the night: a pass every 4 seconds while games are live (live games and new finals only;
# slower upkeep runs alongside, never in the way), slower while waiting for tip-off, and it stops once every game is
# final and verified. Starts every 30 minutes from midday to early morning (Eastern): GitHub's scheduler can start a run
# late or skip one, so a fresh start is always queued behind the running monitor (only one runs at a time) and takes
# over at once if it stops. Starts that find nothing to watch exit within a couple of minutes.
on:
  schedule:
    - cron: '7,37 15-23 * * *'
    - cron: '7,37 0-7 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to run at most (minutes)
        default: '350'

concurrency:
  group: live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/monitor.mjs --minutes "${MINUTES:-350}"
        env:
          MINUTES: ${{ inputs.minutes }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
