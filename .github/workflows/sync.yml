name: Sync stats

# Keeps MongoDB fresh even while the free Render server is asleep.
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Sync box scores into MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then echo "MONGODB_URI secret not set, skipping"; exit 0; fi
          npm run ingest
