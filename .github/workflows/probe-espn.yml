name: Probe ESPN history

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe-espn.mjs
      - name: Push output
        if: always()
        run: |
          cd probe-out
          git init -q && git checkout -q -b espn-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "espn probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" espn-probe:espn-probe
