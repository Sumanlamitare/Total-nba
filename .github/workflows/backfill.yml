name: History backfill

# Box scores from 1993-94 onward (newest seasons first, stopping before the database outgrows its plan), player bios,
# the record lists, career totals, and a replay of recent nights into the feed.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Seasons by end year, newest first (e.g. 2027,2026,2025)
        default: '2027,2026,2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,1995,1994'
      options:
        description: Extra steps (--bios --records --highs --careers)
        default: '--bios --records --highs --careers'
      replay:
        description: Nights to replay into the feed (YYYYMMDD-YYYYMMDD), or empty
        default: ''
      max_mb:
        description: Stop adding seasons once the database reaches this size (MB)
        default: '380'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/backfill.mjs --seasons "$SEASONS" $OPTIONS --max-mb "$MAXMB" ${REPLAY:+--replay "$REPLAY"}
        env:
          SEASONS: ${{ inputs.seasons }}
          OPTIONS: ${{ inputs.options }}
          REPLAY: ${{ inputs.replay }}
          MAXMB: ${{ inputs.max_mb }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
