name: History backfill

# Box scores from 1993-94 onward (newest seasons first, stopping before the database outgrows its plan), player bios,
# the record lists, career totals, and a replay of recent nights into the feed.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Seasons by end year, newest first (e.g. 2027,2026), or 'none'
        default: 'none'
      options:
        description: Extra steps (--free-space --bios --records --highs --careers --drop-history --reset-to YYYYMMDD)
        default: '--bios --careers'
      replay:
        description: Nights to replay into the feed (YYYYMMDD-YYYYMMDD), or 'none'
        default: 'none'
      max_mb:
        description: Stop adding seasons once the whole cluster reaches this size (MB; the free plan holds 512)
        default: '400'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/backfill.mjs --seasons "$SEASONS" $OPTIONS --max-mb "$MAXMB" $( [ "$REPLAY" != none ] && [ -n "$REPLAY" ] && echo --replay "$REPLAY" )
        env:
          SEASONS: ${{ inputs.seasons }}
          OPTIONS: ${{ inputs.options }}
          REPLAY: ${{ inputs.replay }}
          MAXMB: ${{ inputs.max_mb }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
