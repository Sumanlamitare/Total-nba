name: Update data and deploy

# Fetches NBA data from the Big Balls Data API into data/ (committed, no database),
# then builds the React app and publishes it to GitHub Pages.
# Quota: the fetch script stops at 450 requests per UTC day (free key limit is 500).
on:
  schedule:
    - cron: '23 */3 * * *'   # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch from Big Balls Data
        env:
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
        run: npm run fetch
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -qm "Update NBA data" && git pull -q --rebase origin main && git push -q)
      - name: Build site
        run: npm run build && cp -r data dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
