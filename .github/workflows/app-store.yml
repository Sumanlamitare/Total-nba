name: iOS — build & submit to App Store Connect

# Builds the app on Expo's servers (no Mac needed) and uploads it to App Store Connect / TestFlight.
# One-time setup: see mobile/RELEASE.md. Needs these repository secrets:
#   EXPO_TOKEN          — expo.dev → Account settings → Access tokens
#   ASC_API_KEY_P8      — contents of the App Store Connect API key (.p8) file
#   ASC_KEY_ID          — that key's ID
#   ASC_ISSUER_ID       — App Store Connect → Users and Access → Integrations → Issuer ID
#   APPLE_TEAM_ID       — developer.apple.com → Membership → Team ID
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload to App Store Connect after building
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: App Store Connect API key
        run: |
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
      - name: Link the Expo project (first run creates it)
        run: eas init --non-interactive --force
      - name: Build (and submit)
        run: eas build --platform ios --profile production --non-interactive ${{ inputs.submit && '--auto-submit' || '' }}
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
