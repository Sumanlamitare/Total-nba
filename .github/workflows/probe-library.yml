name: Build or snapshot the game data

# Runs the game-data ingest on demand from a branch (the scheduled one lives in ingest.yml), or saves a snapshot.
on:
  workflow_dispatch:
    inputs:
      task:
        description: ingest, snapshot or players (with names)
        default: ingest
      names:
        description: players to look up, comma-separated (task players)
        default: ''

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p probe
      - if: inputs.task == 'snapshot'
        run: |
          npm ci --no-audit --no-fund
          node tools/snapshot.mjs 2>&1 | tee probe/report.txt
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - if: inputs.task == 'ingest'
        run: |
          npm ci --no-audit --no-fund
          node scripts/ingest.mjs --scan 8000 2>&1 | tee probe/report.txt
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - if: inputs.task == 'players'
        run: |
          npm ci --no-audit --no-fund
          node tools/probe-players.mjs "$NAMES" 2>&1 | tee probe/report.txt
        env:
          NAMES: ${{ inputs.names }}
      - name: Push results to the probe branch
        if: always()
        run: |
          cd probe
          git init -q && git checkout -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
