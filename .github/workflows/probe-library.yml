name: Probe ESPN for the player library

# Also runs the catalog ingest on demand from a branch (the scheduled ingest lives in ingest.yml).
on:
  workflow_dispatch:
    inputs:
      task:
        description: probe or ingest
        default: ingest

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p probe
      - if: inputs.task == 'probe'
        run: node tools/probe-library.mjs
      - if: inputs.task != 'probe'
        run: |
          npm ci --no-audit --no-fund
          node scripts/ingest.mjs 2>&1 | tee probe/report.txt
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Push results to the probe branch
        if: always()
        run: |
          cd probe
          git init -q && git checkout -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
