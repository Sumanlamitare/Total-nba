name: Probe ESPN

# Saves ESPN responses for a date to the probe branch (test fixtures, diagnostics).
on:
  workflow_dispatch:
    inputs:
      task:
        description: night (ESPN responses for a date) or snapshot (API responses from the database)
        default: night
      date:
        description: a game date, YYYYMMDD (night); or "season dates" (snapshot), e.g. "2025 20250115,20250616"
        default: '20250115'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p probe
      - if: inputs.task == 'night'
        run: |
          npm ci --no-audit --no-fund
          node tools/probe-night.mjs "$DATE" 2>&1 | tee probe/report.txt
        env:
          DATE: ${{ inputs.date }}
      - if: inputs.task == 'snapshot'
        run: |
          npm ci --no-audit --no-fund
          node tools/snapshot.mjs $DATE 2>&1 | tee probe/report.txt
        env:
          DATE: ${{ inputs.date }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Push results to the probe branch
        if: always()
        run: |
          cd probe
          git init -q && git checkout -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
