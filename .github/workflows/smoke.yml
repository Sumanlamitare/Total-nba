name: Live smoke test

# Checks the deployed site end to end: the app, the feed, the live stream, a game page, records, rendering.
on:
  workflow_dispatch:
    inputs:
      url:
        default: https://total-nba-ja9d.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        env:
          URL: ${{ inputs.url }}
        run: |
          set -e
          curl -fsS "$URL/" | grep -q 'Around the NBA'
          curl -fsS "$URL/api/feed?action=list" | python3 -c "import json,sys; j=json.load(sys.stdin); print('feed entries:', len(j['items'])); [print(' ', e['level'], e['category'], e['headline']) for e in j['items'][:8]]"
          curl -fsS "$URL/api/feed?action=ticker" | python3 -c "import json,sys; print('games today:', len(json.load(sys.stdin)))"
          curl -fsS "$URL/api/feed?action=rail" > /dev/null
          curl -fsS "$URL/api/feed?action=intel" > /dev/null
          curl -fsS "$URL/api/records?action=overview" | python3 -c "import json,sys; j=json.load(sys.stdin); print('record coverage:', j.get('coverage'))"
          curl -fsS "$URL/api/admin?action=status" | python3 -c "import json,sys; print('status:', json.load(sys.stdin))"
          timeout 12 curl -sN "$URL/api/stream" | head -c 300 > stream.txt || true
          grep -q 'event: hello' stream.txt && echo "stream: hello received" || (echo "stream did not answer"; cat stream.txt; exit 1)
