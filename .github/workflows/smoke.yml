name: Smoke test the live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://total-nba-ja9d.vercel.app
  deployment_status:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the pages and the API
        env:
          URL: ${{ inputs.url || github.event.deployment_status.environment_url || 'https://total-nba-ja9d.vercel.app' }}
        run: |
          set -u
          fail=0
          check() { # path, expected status, text that must appear
            body=$(curl -s -w '\n%{http_code}' --max-time 60 "$URL$1"); code=${body##*$'\n'}
            if [ "$code" = "$2" ] && grep -q -- "$3" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 ($code)"; echo "${body:0:300}"; fail=1; fi
          }
          check / 200 'Overlap'
          check /daily/20250115 200 'id="root"'
          check '/api/data?q=home' 200 '"daily"'
          check '/api/data?q=seasons' 200 '"seasons"'
          check '/api/data?q=catalog&mode=season' 200 'Win Shares'
          check '/api/data?q=dataset&mode=daily&date=20250115' 200 '"rows"'
          check '/api/data?q=dataset&mode=daily&date=Jan15' 400 'error'
          check '/api/diagram?list=1' 200 '"diagrams"'
          check '/api/admin?q=settings' 200 '"daily"'
          id=$(curl -s "$URL/api/data?q=home" | jq -r '.daily._id // empty'); echo "latest daily diagram: $id"; [ -n "$id" ] || fail=1
          check "/d/$id" 200 'og:image'
          t=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 60 "$URL/api/og?id=$id"); echo "preview image: $t"; [ "$t" = "200 image/png" ] || fail=1
          exit $fail
