name: Smoke test the live game

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://total-nba-ja9d.vercel.app
  deployment_status:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the page and the game data
        env:
          URL: ${{ inputs.url || github.event.deployment_status.environment_url || 'https://total-nba-ja9d.vercel.app' }}
        run: |
          set -u
          fail=0
          check() { # path, expected status, text that must appear
            body=$(curl -s -w '\n%{http_code}' --max-time 60 "$URL$1"); code=${body##*$'\n'}
            if [ "$code" = "$2" ] && grep -q -- "$3" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 ($code)"; echo "${body:0:300}"; fail=1; fi
          }
          check / 200 'Beat the Dynasty'
          check /api/game 200 "'96 Bulls"
          check /api/game 200 "'17 Warriors"
          check /api/game 200 '"Michael Jordan"'
          check /api/game 200 '"Boston Celtics"'
          check /api/catalog 404 ''
          game=$(curl -s "$URL/api/game")
          e=$(grep -o '"decade":' <<<"$game" | wc -l); echo "franchise-decades: $e"; [ "$e" -gt 120 ] || fail=1
          p=$(grep -o '"ovr":' <<<"$game" | wc -l); echo "player-eras: $p"; [ "$p" -gt 5000 ] || fail=1
          d=$(grep -o '"slot":' <<<"$game" | wc -l); echo "dynasty starters: $d"; [ "$d" -eq 40 ] || fail=1
          exit $fail
