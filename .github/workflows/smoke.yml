name: Smoke test the live site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://total-nba-ja9d.vercel.app
  deployment_status:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the pages and the API
        env:
          URL: ${{ inputs.url || github.event.deployment_status.environment_url || 'https://total-nba-ja9d.vercel.app' }}
        run: |
          set -u
          fail=0
          check() { # path, expected status, text that must appear
            body=$(curl -s -w '\n%{http_code}' --max-time 60 "$URL$1"); code=${body##*$'\n'}
            if [ "$code" = "$2" ] && grep -q -- "$3" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 ($code)"; echo "${body:0:300}"; fail=1; fi
          }
          check / 200 'Performance of the Night'
          check /leaderboard/2025 200 'id="root"'
          check '/api/night?date=20250616' 200 '"Jalen Williams"'
          check '/api/night?date=latest' 200 '"top"'
          check '/api/night?date=Jan15' 400 'error'
          check /api/seasons 200 '"2024-25"'
          check '/api/leaderboard?season=2025' 200 '"Nikola Jokic"'
          check /api/game 404 ''
          check /s/20250616 200 'twitter:card'
          t=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 60 "$URL/api/og?date=20250616"); echo "preview image: $t"; [ "$t" = "200 image/png" ] || fail=1
          n=$(curl -s "$URL/api/night?date=20250115" | grep -o '"categories":' | wc -l); echo "performances on 15 Jan 2025: $n"; [ "$n" -eq 10 ] || fail=1
          s=$(curl -s "$URL/api/seasons" | grep -o '"nights":[0-9]*' | sed 's/.*://' | sort -n | tail -1); echo "most nights in a season: $s"; [ "$s" -gt 200 ] || fail=1
          exit $fail
