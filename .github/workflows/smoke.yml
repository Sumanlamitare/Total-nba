name: Smoke test (live site)

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://total-nba-ja9d.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages, API, database, ping endpoint and badges respond
        env:
          URL: ${{ inputs.url }}
        run: |
          set -e
          check() { code=$(curl -s -o body.txt -w '%{http_code}' "$URL$1"); echo "$1 -> $code $(head -c 160 body.txt | tr '\n' ' ')"; [ "$code" = "$2" ] || { echo "expected $2"; exit 1; }; grep -q "$3" body.txt || { echo "expected body to contain: $3"; exit 1; }; }
          check /                              200 'Turnout'
          check /home                          200 'Turnout'
          check /join/abcd1234                 200 'Turnout'
          check /api/auth                      200 '"user":null'
          check /api/games                     401 'log in'
          check '/api/groups?invite=notreal1'  404 'invite link'
          check /privacy                       200 'Turnout'
          check /support                       200 'Turnout'
          check /preview                       200 '/preview/_expo/static/js/web/'
          check /preview/home                  200 '/preview/_expo/static/js/web/'
          js=$(grep -o '/preview/_expo/static/js/web/[^"]*\.js' body.txt | head -1); code=$(curl -s -o app.js -w '%{http_code}' "$URL$js"); echo "$js -> $code $(wc -c < app.js) bytes"; [ "$code" = 200 ] && [ $(wc -c < app.js) -gt 100000 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer bad.1.0.token' "$URL/api/groups"); echo "bearer -> $code"; [ "$code" = 401 ]
