name: Smoke test the live library

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://total-nba-ja9d.vercel.app
  deployment_status:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check pages and API against live ESPN data
        env:
          URL: ${{ inputs.url || github.event.deployment_status.environment_url || 'https://total-nba-ja9d.vercel.app' }}
        run: |
          set -u
          fail=0
          check() { # path, expected status, text that must appear
            body=$(curl -s -w '\n%{http_code}' --max-time 60 "$URL$1"); code=${body##*$'\n'}
            if [ "$code" = "$2" ] && grep -q -- "$3" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 ($code)"; echo "${body:0:300}"; fail=1; fi
          }
          check / 200 'The Player Library'
          check /book/1966/lebron-james 200 'id="root"'
          check /api/catalog 200 '"Bill Russell"'
          for id in 1966 1035 3975 5104157 3992 4142 4152 2335 4145 2334 215 609 6583 3202; do
            check "/api/book?id=$id" 200 '"name"'
          done
          check '/api/book?id=1966&part=highs' 200 '"covered"'
          check '/api/book?id=4152&part=highs' 200 '"covered"'
          check '/api/search?q=wembanyama' 200 'Wembanyama'
          check '/api/book?id=abc' 400 'error'
          n=$(curl -s "$URL/api/catalog" | grep -o '"i":"' | wc -l); echo "catalog size: $n"; [ "$n" -gt 5000 ] || fail=1
          exit $fail
